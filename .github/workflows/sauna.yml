name: Sauna occupancy

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sauna-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Sample every 15 minutes
        run: |
          git config user.name "sauna-bot"
          git config user.email "sauna-bot@users.noreply.github.com"
          end=$((SECONDS + 5*3600 + 15*60))
          while [ $SECONDS -lt $end ]; do
            python sauna.py log || true
            python sauna.py plot || true
            git add sauna_log.csv sauna_log.png || true
            git diff --staged --quiet || git commit -m "Sauna log $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q || true
            git push -q || true
            sleep 900
          done
