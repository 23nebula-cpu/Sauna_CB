name: Sauna occupancy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sauna-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Log occupancy
        run: python sauna.py log

      - name: Update graph
        run: python sauna.py plot

      - name: Commit results
        run: |
          git config user.name "sauna-bot"
          git config user.email "sauna-bot@users.noreply.github.com"
          git add sauna_log.csv sauna_log.png
          git diff --staged --quiet || git commit -m "Sauna log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
