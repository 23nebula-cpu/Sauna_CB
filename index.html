<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sauna České Budějovice – occupancy</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#2a7de1; --grid:#0001; --card:#f4f5f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161718; --fg:#eee; --muted:#9a9a9a; --line:#5aa2ff; --grid:#fff2; --card:#222426; }
  }
  body { margin:0; padding:16px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:900px; margin:0 auto; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:14px; }
  .big { font-size:2.4rem; font-weight:700; }
  .muted { color:var(--muted); font-size:.9rem; }
  .chart { position:relative; height:320px; }
  a { color:var(--line); }
</style>
</head>
<body>
<main>
  <h1>Sauna České Budějovice – occupancy</h1>
  <div class="card">
    <div class="big" id="now">…</div>
    <div class="muted" id="when">Loading</div>
  </div>
  <div class="card">
    <div class="chart"><canvas id="c"></canvas></div>
    <div class="muted" style="margin-top:8px">Times in Prague time. Logged every 15 min.
      Source: <a href="https://www.kszcb.cz/sauna">kszcb.cz/sauna</a> ·
      <a href="https://raw.githubusercontent.com/23nebula-cpu/Sauna_CB/main/sauna_log.csv">CSV</a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const CSV = "https://raw.githubusercontent.com/23nebula-cpu/Sauna_CB/main/sauna_log.csv";
const fmt = new Intl.DateTimeFormat("cs-CZ", {
  timeZone: "Europe/Prague", weekday: "short", day: "numeric", month: "numeric",
  hour: "2-digit", minute: "2-digit"
});

async function main() {
  const res = await fetch(CSV + "?t=" + Date.now());
  const lines = (await res.text()).trim().split("\n").slice(1);
  const rows = lines.map(l => {
    const [t, p, n, c] = l.split(",");
    return { x: Date.parse(t + ":00Z"), y: +p, n: +n, c: +c };
  }).filter(r => !isNaN(r.x));
  if (!rows.length) { document.getElementById("when").textContent = "No data yet"; return; }

  const last = rows[rows.length - 1];
  document.getElementById("now").textContent = last.y + "% (" + last.n + "/" + last.c + ")";
  document.getElementById("when").textContent = "Last reading: " + fmt.format(last.x);

  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue("--line").trim();
  const grid = css.getPropertyValue("--grid").trim();
  const muted = css.getPropertyValue("--muted").trim();

      responsive: true, maintainAspectRatio: false, parsing: false,
